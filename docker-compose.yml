services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: [ACCESS_KEY]
      MINIO_SECRET_KEY: [SECRET_KEY]
    ports:
      - "9003:9001"
      - "9002:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"

  milvus:
    image: milvusdb/milvus:v2.4.0
    command: milvus run standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: [MINIO_ACCESS_KEY_ID]
      MINIO_SECRET_ACCESS_KEY: [MINIO_SECRET_ACCESS_KEY]
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  ollama:
    image: ollama/ollama:latest
    container_name: iocl_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models
      - ./Modelfile:/Modelfile
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  #Ollama Init for Development purposes - light weight LLM used for testing.
  ollama-init:
    image: ollama/ollama:latest
    container_name: iocl_ollama_init
    entrypoint: [ "/bin/sh", "-c" ]
    volumes:
      - ./models:/models
      - ./Modelfile:/Modelfile
    environment:
      - OLLAMA_HOST=ollama:11434
    command: >
      sh -c "echo 'Waiting for Ollama...'; until ollama list > /dev/null 2>&1; do sleep 2; done; echo 'Creating custom model...'; ollama create iocl-llm -f /Modelfile; echo 'Pulling vision model...'; ollama pull moondream; echo 'Ollama setup complete!'"
    depends_on:
      ollama:
        condition: service_healthy
  #Ollama Init for Development purposes -
    # ollama-init:

    # command: >
    #   sh -c "echo 'Waiting...'; until ollama list > /dev/null 2>&1; do sleep 2; done; 
    #   echo 'Pulling 70B Model...'; ollama pull llama3:70b; 
    #   echo 'Pulling vision...'; ollama pull moondream; 
    #   echo 'Done!'"

    #Oracle Database
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: iocl_oracle
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=[PASSWORD]
    volumes:
      - oracle_data:/opt/oracle/oradata

  #Backend
  backend:
    build: .
    container_name: iocl_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=oracle+oracledb://system:oracle@oracle:1521/XE
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      # - ENCRYPTION_KEY=${ENCRYPTION_KEY} # Pass from host .env right now I disabled this feature due to mac system constraints
      - ENVIRONMENT=production
      - MILVUS_CONN_URI=http://milvus:19530
      - LLM_PROVIDER=ollama
      # Use the cistom model name created in ollama-init
      - LLM_MODEL_PATH=iocl-llm
      - VISION_PROVIDER=ollama
      - VISION_MODEL_NAME=moondream
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      milvus:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
      oracle:
        condition: service_started
    volumes:
      - backend_data:/app/data

  frontend:
    build: ./frontend
    container_name: iocl_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  redis:
    image: redis:alpine
    container_name: iocl_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  ollama_data:
  oracle_data:
  backend_data:


