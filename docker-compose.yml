services:
  backend:
    build: .
    container_name: iocl_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=oracle+oracledb://iocl_ai:iocl_ai_pwd@host.docker.internal:1521/XE
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - ENABLE_ENCRYPTION=True
      - ENCRYPTION_KEY=${ENCRYPTION_KEY} # Pass from host .env
      - ENVIRONMENT=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  frontend:
    build: ./frontend
    container_name: iocl_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  redis:
    image: redis:alpine
    container_name: iocl_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
